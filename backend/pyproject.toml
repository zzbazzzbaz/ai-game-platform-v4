[project]
name = "agent-backend"
version = "0.1.0"
description = "通用智能体后端"
requires-python = ">=3.14"
dependencies = [
    "pydantic-ai-slim[ui,logfire,mcp,openai]==2.68.0",
    "pydantic-ai-harness[coder,e2b]==0.68.0",
    "e2b==2.50.0",
    "fastapi[standard]>=0.120",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "httpx>=0.28",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff==0.17.3",
    "ty==0.0.96",
]
